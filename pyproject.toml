[project]
name = "cr-tax-kb"
version = "0.1.0"
description = "Costa Rica tax, labor and legal knowledge base with verbatim legal texts and an MCP server"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cr-tax-kb = "cr_tax_kb.cli:main"
cr-tax-kb-mcp = "cr_tax_kb.mcp_server:main"
cr-tax-kb-http = "cr_tax_kb.http_server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
